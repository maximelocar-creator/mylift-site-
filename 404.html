<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>MyLift</title>
<style>
  :root { --bg: #050509; --card: #10101c; --line: rgba(255,255,255,.08); --ink0: #ffffff; --ink2: #9ca0b5; --accent: #fc4c02; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink0);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px; text-align: center; }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: -1px; margin-bottom: 18px; }
  .logo span { color: var(--accent); }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { color: var(--ink2); font-size: 15.5px; line-height: 1.5; margin: 0 0 22px; }
  a.btn { display: block; min-height: 50px; line-height: 50px; border-radius: 14px; font-weight: 700; font-size: 17px; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { border: 1px solid var(--line); color: var(--ink0); }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--ink0); }
</style>
</head>
<body>
<main class="card">
  <div class="logo">My<span>Lift</span></div>
  <h1 id="title">Page introuvable</h1>
  <p id="text">Cette adresse n'existe pas.</p>
  <a id="open" class="btn primary" href="#" hidden>Ouvrir dans MyLift</a>
  <a class="btn ghost" href="https://apps.apple.com/app/id6817273456">Télécharger MyLift sur l'App Store</a>
</main>
<script>
  // Liens universels MyLift (1.0.3+) : si l'app est installée, iOS l'ouvre
  // directement et cette page ne s'affiche pas. Sinon (ou app plus ancienne),
  // elle propose d'ouvrir l'app ou de la télécharger. Aucune donnée chargée.
  (function () {
    var m = location.pathname.match(/^\/(share|crew|user)\/([A-Za-z0-9-]{1,64})\/?$/);
    if (!m) return;
    var kind = m[1], id = m[2];
    var title = document.getElementById("title"), text = document.getElementById("text"), open = document.getElementById("open");
    if (kind === "share") { title.textContent = "Programme partagé"; text.textContent = "Un ami te partage son programme. Ouvre-le dans MyLift pour l'ajouter à tes programmes."; }
    if (kind === "crew") { title.textContent = "Séance à plusieurs"; text.textContent = "Rejoins la séance de ton ami dans MyLift."; }
    if (kind === "user") { title.textContent = "Profil MyLift"; text.textContent = "Ouvre ce profil dans MyLift pour envoyer une demande d'ami."; }
    open.setAttribute("href", "mylift://" + kind + "/" + encodeURIComponent(id));
    open.hidden = false;
  })();
</script>
</body>
</html>
